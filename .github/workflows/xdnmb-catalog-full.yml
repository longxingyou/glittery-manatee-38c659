# X岛 catalog 全版面补充扫描（每日 03:00 Asia/Shanghai = 19:00 UTC 前一天）
# 一次性扫完所有版面所有页，发现的未索引串入队 D1 recrawl_queue
name: XDNMB Catalog Full Scan

on:
  schedule:
    # UTC 19:00 = Asia/Shanghai 03:00
    - cron: '0 19 * * *'
  workflow_dispatch: # 允许手动触发；max_pages=0 可做全历史枚举（耗时长）
    inputs:
      max_pages:
        description: '每版面扫描页数上限（0=不封顶）'
        required: false
        default: '20'

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run catalog full scan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          XDNMB_USERHASH: ${{ secrets.XDNMB_USERHASH }}
          TG_GATEWAY_URL: ${{ secrets.TG_GATEWAY_URL }}
          TG_GATEWAY_SECRET: ${{ secrets.TG_GATEWAY_SECRET }}
          MAX_PAGES_PER_BOARD: ${{ github.event.inputs.max_pages || '20' }}
        run: node scripts/xdnmb-catalog-full.mjs
