# VPS（Azure / 任意 Linux + Docker）部署：网关 + Caddy 自动 HTTPS
# 用法：
#   1. cp .env.example .env 并填好
#   2. 把 caddy/Caddyfile 里的域名改成实际网关域名
#   3. docker compose up -d --build
services:
  gateway:
    build: .
    image: sg-bot-gateway:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内固定监听 8080；对外由 Caddy 反代
      PORT: "8080"
    volumes:
      - tg-data:/data/tg
      - preview-data:/data/previews
    expose:
      - "8080"

  # Office → PDF 转换服务（串行、512MiB 内存上限，压测见 lo-bench）
  converter:
    build: ./converter
    image: sg-preview-converter:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 签名 URL 经 docker 内网直取 gateway，不经 Cloudflare
      GW_INTERNAL_ORIGIN: "http://gateway:8080"
      POLL_INTERVAL_MS: "5000"
    mem_limit: 512m
    memswap_limit: 2048m
    cpus: 2.0
    depends_on:
      - gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

volumes:
  tg-data:
  preview-data:
  caddy-data:
  caddy-config:
